# YOLO26-Crack v7 (scale s) — "SPD-A2-P2" novel road-damage model
# Design rationale (literature-backed):
#   1. Focus (space-to-depth, = SPD-Conv, Sunkara & Luo 2022) replaces strided Conv at
#      P2->P3 and P3->P4: lossless downsampling preserves thin, low-contrast crack pixels
#      that stride-2 convolution discards.
#   2. A2C2f area attention (YOLOv12) at backbone P4 and head P3: long-range context
#      along elongated crack structures; re-weights low-contrast responses.
#   3. P2/4 high-resolution detection head: fine/hairline cracks (YOLOv8-PD, YOLOv11n-CDL).
#   4. BiFPN-style cross-scale skips: backbone P3/P4 concatenated directly into the
#      top-down->bottom-up fusion (BsS-YOLO, YOLOv8n-SBP) for richer multi-scale fusion.
#   5. C2PSA retained after SPPF for global contrast re-weighting.

# Parameters
nc: 3 # alligator, crack, patching  (set to your dataset's nc)
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Focus, [256, 3]] # 3-P3/8  SPD downsample (space-to-depth, lossless)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Focus, [512, 3]] # 5-P4/16 SPD downsample
  - [-1, 2, A2C2f, [512, True, 4]] # 6  area attention: elongated-crack context
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 16 (P3/8) area attention at crack scale

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall) hairline cracks

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16, 4], 1, Concat, [1]] # cat head P3 + backbone P3 (BiFPN-style skip)
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13, 6], 1, Concat, [1]] # cat head P4 + backbone P4 (BiFPN-style skip)
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large)

  - [[22, 25, 28], 1, Detect, [nc]] # Detect(P3,P4,P5) - P2 branch (19) features only # Detect(P2, P3, P4, P5)
